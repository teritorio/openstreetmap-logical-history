name: Test Ruby

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libgeos-dev libproj-dev

      - uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 1

      # - name: Setup Tapioca cache
      #   id: cache-tapioca
      #   uses: actions/cache@v5
      #   with:
      #     path: sorbet
      #     key: ${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}

      # - name: Init Tapioca
      #   if: steps.cache-tapioca.outputs.cache-hit != 'true'
      #   run: |
      #     bundle exec tapioca init && \
      #     bundle exec srb rbi suggest-typed

      - name: Build missing levenshtein
        run: cd /home/runner/work/openstreetmap-logical-history/openstreetmap-logical-history/vendor/bundle/ruby/3.2.0/gems/levenshtein-ffi-1.1.0/ext/levenshtein && make

      - name: Run rubocop
        run: bundle exec rubocop --parallel -c .rubocop.yml

      # - name: Run typecheck
      #   run: |
      #     bundle exec rake rails_rbi:routes && \
      #     bundle exec srb typecheck -q
      #     # bundle exec tapioca dsl && \

      # - name: Run security checks
      #   run: |
      #     bin/bundler-audit --update
      #     bin/brakeman -q -w2

      # - name: Run tests
      #   run: bundle exec rake test

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Docker Build and Push
        uses: cartoway/docker-compose-build-push-action@main
        with:
          registry_password: ${{ secrets.GITHUB_TOKEN }}
